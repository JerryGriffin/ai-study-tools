<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="author" content="JerryGriffin H1"><meta name="version" content="1.0.0-preview8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>教材辅导 · 学序</title>
<link rel="stylesheet" href="style.css?v=1.0.0-preview8&b=1">
</head>
<body>
<div class="app" id="app">

  <main class="main">
    <header class="topbar clean-top">
      <a class="back-home" href="../" title="返回主页" aria-label="返回主页">←</a>
      <div class="brand">教材辅导 <span>学序</span></div>
      <div class="top-title" id="coverageLine"></div>
      <div class="top-actions">
        <button class="topbtn" id="topBnu">北师大教材</button>
        <button class="topbtn" id="topBrowser">教材章节</button>
        <button class="topbtn" id="topCites">依据</button>
        <button class="topbtn" id="topSettings">设置</button>
        <button class="topbtn ghost" id="topClear">清空</button>
      </div>
      <span class="badge" id="modeBadge">在线</span>
    </header>

    <section class="welcome" id="welcome">
      <div class="welcome-inner">
        <h1>教材辅导</h1>
        <p class="wsub">北京师范大学 · 大学理工教材</p>
        <div class="askbox">
          <div class="modechips" id="modeChipsWelcome"></div>
          <textarea id="inputWelcome" rows="2" placeholder="输入题目或概念…"></textarea>
          <div class="askbox-foot">
            <span class="ask-hint">Enter 发送</span>
            <button class="send" id="sendWelcome" title="发送"><span>发送</span><span aria-hidden="true">↑</span></button>
          </div>
        </div>
        <div class="examples" id="quickRow"></div>
      </div>
    </section>

    <section class="chatwrap" id="chatwrap">
      <div id="chat" class="chat"></div>
      <div class="composer">
        <div class="askbox bottom">
          <div class="modechips" id="modeChips"></div>
          <textarea id="input" rows="2" placeholder="输入题目或概念…"></textarea>
          <div class="askbox-foot">
            <span class="ask-hint" id="statusLine">就绪</span>
            <button class="send" id="sendBtn" title="发送"><span>发送</span><span aria-hidden="true">↑</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 设置浮层：默认收起，点顶栏“设置”展开 -->
  <div class="settings-pop" id="settingsPop">
    <details class="apibox" id="apiBox" open>
      <summary>模型设置</summary>
      <label class="lbl" hidden>服务商预设</label>
      <select id="apiPreset" hidden>
        <option value="custom">自定义</option>
        <option value="deepseek">自定义</option>
        <option value="openai">自定义</option>
        <option value="openrouter">自定义</option>
        <option value="moonshot">自定义</option>
      </select>
      <label class="lbl">接口地址</label>
      <input id="apiBase" type="text" placeholder="接口地址" autocomplete="off">
      <label class="lbl">API Key（可留空）</label>
      <input id="apiKey" type="password" placeholder="可留空" autocomplete="off">
      <label class="lbl">模型名</label>
      <input id="apiModel" type="text" placeholder="填写模型名称" autocomplete="off">
      <div class="row">
        <button class="btn" id="saveApi">保存</button>
        <button class="btn ghost" id="clearApi">恢复默认</button>
      </div>
      <p class="hint" id="apiStatus">未连接</p>
    </details>
  </div>

  <!-- 隐藏的旧导航：保留 app.js 需要的 ID，界面不再显示侧边栏 -->
  <div class="legacy" hidden>
    <button id="newChat"></button>
    <button id="navBrowser"></button>
    <button id="navTrends"></button>
    <button id="navCites"></button>
    <button id="collapseSide"></button>
    <button id="showSide"></button>
  </div>

  <!-- 依据抽屉 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="citeDrawer">
    <div class="drawer-head">
      <h3>依据与错题</h3>
      <button class="iconbtn" id="closeDrawer">×</button>
    </div>
    <div class="drawer-body">
      <section><h2>检索范围</h2>
        <div class="row">
          <select id="stageFilter">
            <option value="all">全部学段</option>
            <option value="highschool">高中</option>
            <option value="university">大学</option>
          </select>
          <select id="subjectFilter"><option value="all">全部学科</option></select>
        </div>
        <div class="row">
          <select id="publisherFilter">
            <option value="all">全部教材</option>
            <option value="bnu">北京师范大学出版社</option>
          </select>
        </div>
        <p class="hint" id="scopeCount"></p>
      </section>
      <section><h2>本轮依据</h2><div id="citations" class="cites"><p class="hint">提问后显示命中的知识点与章节。</p></div></section>
      <section class="optional"><h2>知识点索引</h2><div id="kgList" class="kglist"></div></section>
      <section><h2>错题本</h2>
        <div class="row"><input id="wrongQ" type="text" placeholder="题目摘要"><input id="wrongR" type="text" placeholder="错因"></div>
        <button class="btn ghost wide" id="addWrong">加入错题本</button>
        <ul class="wronglist" id="wrongList"></ul>
      </section>
      <section class="optional"><h2>知识库</h2>
        <ul class="srclist" id="sourceList"></ul>
        <label class="importbtn" for="fileInput">导入自备资料（TXT / MD / JSON）</label>
        <input id="fileInput" type="file" accept=".txt,.md,.markdown,.json,text/plain,application/json" multiple hidden>
        <p class="hint">文件只在浏览器本地读取，不上传、不分发。</p>
      </section>
      <section class="optional"><h2>开放语料许可</h2><ul class="srclist tight" id="licenseList"></ul></section>
    </div>
  </aside>

  <!-- 教材章节浏览 -->
  <div id="chapterModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>教材章节练习 <span class="hint" id="modalStat"></span></h3>
        <button class="btn ghost" id="closeBrowser">关闭</button>
      </div>
      <div class="modal-body">
        <div class="col-books" id="bookList"></div>
        <div class="col-chapters" id="chapterList"></div>
        <div class="col-detail" id="chapterDetail"></div>
      </div>
    </div>
  </div>

  <!-- 命题趋势：默认不展示，保留 DOM 兼容 app.js -->
  <div id="trendModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>命题趋势与版权边界</h3>
        <button class="btn ghost" id="closeTrends">关闭</button>
      </div>
      <div class="modal-body single">
        <div class="trend-wrap" id="trendBody"></div>
      </div>
    </div>
  </div>

</div>

<script src="knowledge.js?v=1.0.0-preview8&b=2"></script>
<script src="trends.js?v=1.0.0-preview8"></script>
<script src="app.js?v=1.0.0-preview8&b=3"></script>
<script>
(function () {
  function click(id) { var el = document.getElementById(id); if (el) el.click(); }
  var browser = document.getElementById('topBrowser');
  var bnu = document.getElementById('topBnu');
  var cites = document.getElementById('topCites');
  var settings = document.getElementById('topSettings');
  var clear = document.getElementById('topClear');
  var pop = document.getElementById('settingsPop');
  if (browser) browser.onclick = function () { click('navBrowser'); };
  if (bnu) bnu.onclick = function () {
    var sel = document.getElementById('publisherFilter');
    if (sel) { sel.value = 'bnu'; sel.dispatchEvent(new Event('change', { bubbles: true })); }
    click('navBrowser');
  };
  if (cites) cites.onclick = function () { click('navCites'); };
  if (clear) clear.onclick = function () { click('newChat'); };
  if (settings) settings.onclick = function (e) {
    e.stopPropagation();
    if (pop) pop.classList.toggle('open');
  };
  document.addEventListener('click', function (e) {
    if (!pop || !pop.classList.contains('open')) return;
    if (pop.contains(e.target) || (settings && settings.contains(e.target))) return;
    pop.classList.remove('open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && pop) pop.classList.remove('open');
  });
})();
</script>
</body>
</html>
